<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — Plataforma de Cursos | Ingeniería de Sistemas</title>
  <meta name="description"
    content="Formulario de registro para la plataforma de cursos
             de la Facultad de Ingeniería de Sistemas.">
</head>
<body>

  <header>
    <h1>Registro de Nuevo Estudiante</h1>
    <p>Plataforma de Cursos — Facultad de Ingeniería de Sistemas</p>
  </header>

  <main>
    <form
      action="/api/registro"
      method="POST"
      autocomplete="on"
      id="form-registro"
    >
      <!-- Los fieldsets se agregan en los pasos siguientes -->

      <fieldset>
  <legend>Datos Personales</legend>

  <!-- Nombre completo: text con minlength y maxlength -->
  <div>
    <label for="nombre">Nombre completo *</label>
    <input
      type="text"
      id="nombre"
      name="nombre"
      placeholder="Ej: Ana García Martínez"
      required
      minlength="5"
      maxlength="100"
      autocomplete="name"
    >
  </div>

  <!-- Correo electrónico: validación automática de formato -->
  <div>
    <label for="email">Correo electrónico institucional *</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="codigo@universidad.edu.co"
      required
      autocomplete="email"
      aria-describedby="email-ayuda"
    >
    <p id="email-ayuda">Usar el correo institucional (termina en .edu.co).</p>
  </div>

  <!-- Teléfono: pattern para formato colombiano -->
  <div>
    <label for="telefono">Número de teléfono (opcional)</label>
    <input
      type="tel"
      id="telefono"
      name="telefono"
      placeholder="+573001234567"
      pattern="(\+57)?[0-9]{10}"
      title="Número colombiano: +57 seguido de 10 dígitos"
      autocomplete="tel"
    >
  </div>

  <!-- Fecha de nacimiento: con rango válido de edad universitaria -->
  <div>
    <label for="nacimiento">Fecha de nacimiento *</label>
    <input
      type="date"
      id="nacimiento"
      name="fecha_nacimiento"
      required
      min="1985-01-01"
      max="2006-12-31"
      autocomplete="bday"
    >
  </div>

    </fieldset>

    </form>
  </main>

  <footer>
    <p><small>&copy; 2026 Universidad — Ingeniería de Sistemas.</small></p>
  </footer>

</body>
</html>
